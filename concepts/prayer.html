<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Manzil Abdallah - Concept Horaires (Carré)</title>
    <link rel="stylesheet" href="prayer.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <a href="index.html" class="back-nav"><i class="fas fa-arrow-left"></i> Retour</a>

    <div class="square-poster">
        <div class="left-panel">
            <img src="../assets/logo.jpeg" class="app-logo" alt="Logo">
            <div class="brand">Manzil Abdallah</div>
            <div class="border-deco"></div>
            <h1>Précision &<br>Sérénité.</h1>
            <p>Horaires calculés selon votre position exacte et direction de la Qibla.</p>

            <div class="store-buttons">
                <div class="btn"><i class="fab fa-apple"></i> App Store</div>
                <div class="btn"><i class="fab fa-google-play"></i> Google Play</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="phone-mockup">
                <div class="screen">
                    <div style="padding: 0 20px;">
                        <h3 style="color: #4B5563; margin-bottom: 20px;">Aujourd'hui</h3>

                        <div
                            style="display: flex; justify-content: space-between; padding: 15px; background: white; border-radius: 10px; margin-bottom: 10px;">
                            <span style="font-weight: 600;">Fajr</span>
                            <span>05:45</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; padding: 15px; background: #1E4D2B; color: white; border-radius: 10px; margin-bottom: 10px;">
                            <span style="font-weight: 600;">Dhuhr</span>
                            <span>13:30</span>
                        </div>
                        <div
                            style="display: flex; justify-content: space-between; padding: 15px; background: white; border-radius: 10px; margin-bottom: 10px;">
                            <span style="font-weight: 600;">Asr</span>
                            <span>16:45</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
