<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manzil Abdallah - Galerie Concepts</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background: #f4f4f4;">

    <div style="text-align: center; padding: 3rem 0;">
        <h1 style="font-family: 'Playfair Display', serif; color: #1E4D2B; margin-bottom: 0.5rem;">Concepts Affiches
        </h1>
        <p style="color: #666;">Cliquez sur un concept pour le visualiser en plein écran</p>
    </div>

    <div class="dashboard-grid">
        <!-- Home -->
        <a href="home.html" class="concept-card">
            <div class="card-preview" style="background: #1E4D2B;">
                <img src="../assets/logo.jpeg" style="width: 50px; border-radius: 50%;">
            </div>
            <div class="card-info">
                <h3>Présentation</h3>
                <p>Accueil, Branding</p>
            </div>
        </a>

        <!-- Tawhid -->
        <a href="tawhid.html" class="concept-card">
            <div class="card-preview" style="background: #E3E9E4; color: #1E4D2B;">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="card-info">
                <h3>Tawhid</h3>
                <p>Double Écran, Savoir</p>
            </div>
        </a>

        <!-- Card 1 -->
        <a href="quran.html" class="concept-card">
            <div class="card-preview bg-quran">
                <i class="fas fa-quran"></i>
            </div>
            <div class="card-info">
                <h3>Le Coran</h3>
                <p>Minimaliste, Clair, Épuré</p>
            </div>
        </a>

        <!-- Card 2 -->
        <a href="ramadan.html" class="concept-card">
            <div class="card-preview bg-ramadan">
                <i class="fas fa-moon"></i>
            </div>
            <div class="card-info">
                <h3>Ramadan</h3>
                <p>Nuit, Mystique, Gold</p>
            </div>
        </a>

        <!-- Card 3 -->
        <a href="tasbih.html" class="concept-card">
            <div class="card-preview bg-tasbih">
                <i class="fas fa-fingerprint"></i>
            </div>
            <div class="card-info">
                <h3>Tasbih</h3>
                <p>Dynamique, Moderne, Split</p>
            </div>
        </a>

        <!-- Card 4 -->
        <a href="prayer.html" class="concept-card">
            <div class="card-preview bg-prayer" style="border: 1px solid #ddd;">
                <i class="fas fa-clock" style="color: #1E4D2B;"></i>
            </div>
            <div class="card-info">
                <h3>Horaires</h3>
                <p>Élégant, Éditorial, Asymétrique</p>
            </div>
        </a>
    </div>

</body>

</html>
